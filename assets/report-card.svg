    <text x="22" y="618" fill="#00add8">── Suggested Actions ──────────────────────────────────────────────────────</text>
    <text x="47" y="641" fill="#00add8">→</text>
    <text x="72" y="641" fill="#c9d1d9">Verify :8080/tcp should be answering from gitea.</text>
  </g>
</svg>
