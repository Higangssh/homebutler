openapi: 3.1.0
info:
  title: homebutler web dashboard API
  version: 1.7.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: |
    The HTTP API behind the homebutler web dashboard. `homebutler serve` starts it, and every route on this page is the same one the dashboard calls, so anything the dashboard shows or does you can read or run from a script.

    Reads answer without a token when the server starts without one. Routes that change something exist only when the server starts with a token. Without a token those routes are not registered at all and answer `404`, not `401`.

    Every error is a JSON object with one field: `{"error": "<message>"}`.
servers:
  - url: http://localhost:8080
    description: The default address of `homebutler serve`. Change it with `--host` and `--port`.
security:
  - bearerAuth: []
  - {}
tags:
  - name: Overview and servers
    description: Read the machine homebutler runs on, and the servers in your configuration.
  - name: Report and doctor
    description: Compare the machine with its last saved snapshot, and check it for problems.
  - name: Docker
    description: List containers and their usage, and restart or stop a container.
  - name: Watch and alerts
    description: Check alert thresholds, manage the watch list, and read recorded incidents.
  - name: Backups
    description: Create, list, drill and restore Docker compose backups.
  - name: Install
    description: Install, inspect, uninstall and purge the apps in the catalogue.
  - name: Proxmox
    description: Read Proxmox VE endpoints and guests, and start, reboot or shut down a guest.
  - name: Wake and notify
    description: Send a Wake-on-LAN packet and test your notification channels.
  - name: Config
    description: Read the settings the dashboard shows, and save changes to the config file.
  - name: Meta
    description: Ask the server what it can do, which version it is, and what its CORS preflight allows.
paths:
  /api/overview:
    get:
      tags:
        - Overview and servers
      operationId: getOverview
      summary: Get overview
      description: Reads every server in your configuration at once and returns one entry per server. A server that does not answer within four seconds is reported from its last successful reading with `status` set to `stale`, or as `unavailable` when it has never answered.
      x-protection: none
      responses:
        '200':
          description: One reading per configured server. The example is shortened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
              example:
                collected_at: '2026-10-25T18:57:47.088855825Z'
                servers:
                  - name: nas
                    host: 192.0.2.10
                    local: false
                    status: unavailable
                    failure_class: authentication
                    message: The server refused the configured credentials.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/servers:
    get:
      tags:
        - Overview and servers
      operationId: listServers
      summary: List servers
      description: Lists the servers in your configuration. Use a `name` from this list as the `server` query parameter on the read routes, and as the path parameter of [Get server status](/reference/api/overview-and-servers/get-server-status).
      x-protection: none
      responses:
        '200':
          description: The configured servers, in configuration order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServerInfo'
              example:
                - name: homelab
                  host: 192.168.1.10
                  local: true
                - name: nas
                  host: 192.0.2.10
                  local: false
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/servers/{name}/status:
    get:
      tags:
        - Overview and servers
      operationId: getServerStatus
      summary: Get server status
      description: Returns the system status of one configured server. A server marked `local` is read directly; any other is read over SSH by running `homebutler status --json` on it.
      x-protection: none
      parameters:
        - name: name
          in: path
          required: true
          description: The `name` of a server, from [List servers](/reference/api/overview-and-servers/list-servers).
          schema:
            type: string
            example: homelab
      responses:
        '200':
          description: The server's status. The example is shortened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusDoc'
              example:
                schema_version: 1
                hostname: homelab
                os: linux
                arch: amd64
                uptime: 15h 39m
                cpu:
                  usage_percent: 4.65
                  cores: 4
                memory:
                  total_gb: 7.75
                  used_gb: 2.83
                  usage_percent: 36.53
                disks:
                  - mount: /
                    total_gb: 19
                    used_gb: 1.2
                    usage_percent: 7
                time: '2026-10-25T11:57:48-07:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No server has this name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: server "nope" not found
        '502':
          description: A remote server did not answer. The message names the class of failure and never the address or the SSH output.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: The server refused the configured credentials.
  /api/status:
    get:
      tags:
        - Overview and servers
      operationId: getStatus
      summary: Get system status
      description: Returns CPU, memory and disk readings for the machine homebutler runs on, or for the server named in `server`.
      x-protection: none
      parameters:
        - $ref: '#/components/parameters/Server'
      responses:
        '200':
          description: The system status. The example is shortened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusDoc'
              example:
                schema_version: 1
                hostname: homelab
                os: linux
                arch: amd64
                uptime: 15h 39m
                cpu:
                  usage_percent: 0
                  cores: 4
                memory:
                  total_gb: 7.75
                  used_gb: 2.83
                  usage_percent: 36.53
                disks:
                  - mount: /
                    total_gb: 19
                    used_gb: 1.2
                    usage_percent: 7
                time: '2026-10-25T11:57:49-07:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: The readings could not be taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: <message>
        '501':
          description: homebutler runs in a container, which cannot read the machine it runs on. Run it on the host, or name a remote server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: <message>
        '502':
          description: The server named in `server` did not answer. The message is the SSH error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: |-
                  [nas] failed to load SSH key (): no SSH key found (tried ~/.ssh/id_ed25519, ~/.ssh/id_rsa). Specify key path in config or use auth: password
                    → Check this server's 'key' in /home/you/.config/homebutler/config.yaml
  /api/processes:
    get:
      tags:
        - Overview and servers
      operationId: listProcesses
      summary: List top processes
      description: Returns the ten processes using the most CPU, busiest first. Without `server`, the route returns the list itself, without the `total` and `zombies` fields the MCP tool adds. With `server`, it returns the document that `homebutler processes --json` prints on that server, an object with a `processes` array and `total`.
      x-protection: none
      parameters:
        - $ref: '#/components/parameters/Server'
      responses:
        '200':
          description: The ten busiest processes. The example is shortened.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcessInfo'
              example:
                - pid: 1731
                  name: containerd
                  cpu: 9.7
                  mem: 0.7
                  rss: 62144
                  state: S
                - pid: 1888
                  name: dockerd
                  cpu: 4.7
                  mem: 1.2
                  rss: 99540
                  state: S
                - pid: 460000
                  name: sh
                  cpu: 4.5
                  mem: 0
                  rss: 1144
                  state: S
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          description: The server named in `server` did not answer. The message is the SSH error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: <message>
        '500':
          description: The process table could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: <message>
  /api/ports:
    get:
      tags:
        - Overview and servers
      operationId: listPorts
      summary: List open ports
      description: Lists the TCP ports listening on the machine, with the process or Docker container that owns each one. With `server`, the route returns the array that `homebutler ports --json` prints on that server, without the `ports` wrapper. When the ports cannot be listed, the route returns `500` with the reason.
      x-protection: none
      parameters:
        - $ref: '#/components/parameters/Server'
      responses:
        '200':
          description: The listening ports. The example is shortened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortsResult'
              example:
                ports:
                  - protocol: tcp
                    address: 127.0.0.1
                    port: '53'
                  - protocol: tcp
                    address: 0.0.0.0
                    port: '18611'
                    container: gitea (imgproxy:1)
                  - protocol: tcp
                    address: 0.0.0.0
                    port: '18610'
                    container: web (node:lts-alpine)
                  - protocol: tcp
                    address: 192.168.5.1
                    port: '53'
                  - protocol: tcp
                    address: 127.0.0.1
                    port: '18600'
                    pid: '459588'
                    process: homebutler
                  - protocol: tcp
                    address: 127.0.0.1
                    port: '18602'
                    pid: '459604'
                    process: homebutler
                  - protocol: tcp
                    address: 0.0.0.0
                    port: '22'
                  - protocol: tcp
                    address: '[::1]'
                    port: '53'
                  - protocol: tcp
                    address: '*'
                    port: '18601'
                  - protocol: tcp
                    address: '[::]'
                    port: '18611'
                    container: gitea (imgproxy:1)
                  - protocol: tcp
                    address: '[::]'
                    port: '18610'
                    container: web (node:lts-alpine)
                  - protocol: tcp
                    address: '[fe80::5055:55ff:fe23:93b6]%eth0'
                    port: '53'
                  - protocol: tcp
                    address: '[::]'
                    port: '22'
                missing_process: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          description: The server named in `server` did not answer. The message is the SSH error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: <message>
        '500':
          description: The ports could not be read. The error gives the reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/report:
    get:
      tags:
        - Report and doctor
      operationId: getReport
      summary: Get report
      description: With `server`, compares that server over SSH and saves nothing on it, with the same `summary` as a local report. Compares the machine with the last saved snapshot and lists what needs attention and what changed. Reading a report never saves a snapshot, so a dashboard can poll this route without moving its own baseline. To save one, call [Save report snapshot](/reference/api/report-and-doctor/save-report-snapshot).
      x-protection: none
      parameters:
        - $ref: '#/components/parameters/Server'
      responses:
        '200':
          description: The report. `is_baseline` is `true` when there is no snapshot to compare against. The example is shortened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
              example:
                schema_version: 1
                timestamp: '2026-10-25T18:58:24Z'
                server_name: homelab
                is_baseline: false
                snapshot_saved: false
                system:
                  hostname: homelab
                  os: linux
                  arch: amd64
                  uptime: 15h 40m
                  cpu:
                    usage_percent: 0.75
                    cores: 4
                  memory:
                    total_gb: 7.75
                    used_gb: 2.82
                    usage_percent: 36.45
                  disks:
                    - mount: /
                      total_gb: 19
                      used_gb: 1.2
                      usage_percent: 7
                  time: '2026-10-25T11:58:24-07:00'
                running_count: 8
                stopped_count: 11
                public_port_count: 11
                status:
                  - 'Host: homelab (linux/amd64), uptime 15h 40m'
                  - 'CPU: 0.8% (4 cores), Memory: 2.8/7.8 GB (36%)'
                  - 'Disk /: 1.2/19.0 GB (7%)'
                  - 'Containers: 8 running, 11 stopped'
                  - 'Public ports: 11'
                needs_attention:
                  - kind: container
                    text: 11 container(s) stopped
                  - kind: container
                    target: whoami
                    text: whoami stopped since the last report
                notable_changes:
                  - kind: state
                    target: whoami
                    detail: running → exited
                    text: 'state: whoami — running → exited'
                compared_to: '2026-10-25T18:58:09Z'
                suggested_actions:
                  - text: 'Check why whoami is not running: homebutler docker logs whoami'
                    command: homebutler docker logs whoami
                    runner: mcp
                    tool: docker_logs
                summary:
                  needs_attention: 3
                  notable_changes: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: The report could not be built.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: <message>
        '502':
          description: The server named in `server` did not answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: |-
                  [nas] failed to load SSH key (): no SSH key found (tried ~/.ssh/id_ed25519, ~/.ssh/id_rsa). Specify key path in config or use auth: password
                    → Check this server's 'key' in /home/you/.config/homebutler/config.yaml
  /api/report/snapshot:
    post:
      tags:
        - Report and doctor
      operationId: saveReportSnapshot
      summary: Save report snapshot
      description: 'Builds a report and saves it as the snapshot the next report compares against. Protection: token.'
      x-protection: token
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Server'
      responses:
        '200':
          description: The report that was just built, with `snapshot_saved` set to `true`. The example is shortened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
              example:
                schema_version: 1
                timestamp: '2026-10-25T18:58:26Z'
                server_name: homelab
                is_baseline: false
                snapshot_saved: true
                system:
                  hostname: homelab
                  os: linux
                  arch: amd64
                  uptime: 15h 40m
                  cpu:
                    usage_percent: 3.84
                    cores: 4
                  memory:
                    total_gb: 7.75
                    used_gb: 2.83
                    usage_percent: 36.53
                  disks:
                    - mount: /
                      total_gb: 19
                      used_gb: 1.2
                      usage_percent: 7
                  time: '2026-10-25T11:58:25-07:00'
                running_count: 8
                stopped_count: 11
                public_port_count: 11
                status:
                  - 'Host: homelab (linux/amd64), uptime 15h 40m'
                  - 'CPU: 3.8% (4 cores), Memory: 2.8/7.8 GB (37%)'
                  - 'Disk /: 1.2/19.0 GB (7%)'
                  - 'Containers: 8 running, 11 stopped'
                  - 'Public ports: 11'
                needs_attention:
                  - kind: container
                    text: 11 container(s) stopped
                  - kind: container
                    target: whoami
                    text: whoami stopped since the last report
                notable_changes:
                  - kind: state
                    target: whoami
                    detail: running → exited
                    text: 'state: whoami — running → exited'
                compared_to: '2026-10-25T18:58:09Z'
                suggested_actions:
                  - text: 'Check why whoami is not running: homebutler docker logs whoami'
                    command: homebutler docker logs whoami
                    runner: mcp
                    tool: docker_logs
                summary:
                  needs_attention: 3
                  notable_changes: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotRegistered'
        '500':
          description: The report could not be built or saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: <message>
  /api/doctor:
    get:
      tags:
        - Report and doctor
      operationId: runDoctor
      summary: Run doctor
      description: Checks the machine for problems across system, Docker, exposure, backups, watch, notifications, Proxmox and configuration, and returns one finding per check. Every `warn` and `fail` finding carries the command that fixes or investigates it.
      x-protection: none
      parameters:
        - $ref: '#/components/parameters/Server'
      responses:
        '200':
          description: The findings and a count per severity. The example is shortened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorResult'
              example:
                schema_version: 1
                timestamp: '2026-10-25T18:57:55Z'
                server_name: homelab
                status: fail
                summary:
                  pass: 0
                  warn: 5
                  fail: 2
                findings:
                  - severity: warn
                    category: exposure
                    title: 6 port(s) are listening on all interfaces
                    detail: 18601/tcp, 18610/tcp, 18611/tcp, 22/tcp, 3399/tcp, 8080/tcp
                    action: Make sure each one is intentional and protected by firewall, reverse proxy, or login where needed.
                    command: homebutler inventory scan
                    runner: mcp
                    tool: inventory_scan
                  - severity: warn
                    category: backup
                    title: No backups found
                    detail: No .tar.gz backups found in /home/you/backups.
                    action: Create your first backup, then verify at least one important app with a drill.
                    command: homebutler backup
                    runner: mcp
                    tool: backup_create
                  - severity: warn
                    category: proxmox
                    title: Proxmox endpoint "pve" accepts any certificate
                    detail: 'insecure: true disables certificate verification entirely, so anything on the network path can read the API token and answer for the endpoint.'
                    action: Pin the certificate with fingerprint, or trust its issuer with ca_file, and remove insecure.
                    command: homebutler proxmox status --endpoint pve
                    runner: mcp
                    tool: proxmox_status
                  - severity: warn
                    category: report
                    title: No report baseline yet
                    detail: Doctor did not find previous report snapshots.
                    action: Run report once so homebutler can notice what changes later.
                    command: homebutler report
                    runner: mcp
                    tool: report
                  - severity: fail
                    category: proxmox
                    title: Proxmox endpoint "pve" has no readable collectors
                    detail: 'version: proxmox request /api2/json/version: Get "https://127.0.0.1:8699/api2/json/version": dial tcp 127.0.0.1:8699: connect: connection refused'
                    action: Check network reachability to the configured host and port, and any firewall rules in between.
                    command: homebutler proxmox status --endpoint "pve"
                    runner: mcp
                    tool: proxmox_status
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: The checks could not run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: <message>
  /api/docker:
    get:
      tags:
        - Docker
      operationId: listContainers
      summary: List containers
      description: Lists every Docker container on the machine, running or stopped. When Docker does not answer, the route still returns `200` with `available` set to `false` and an empty list.
      x-protection: none
      parameters:
        - $ref: '#/components/parameters/Server'
      responses:
        '200':
          description: 'The containers, or `available: false` when Docker is not reachable. The example is shortened.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerList'
              example:
                available: true
                containers:
                  - id: 986579b4a954
                    name: romantic_zhukovsky
                    image: alpine
                    status: Running · 4m
                    state: running
                    ports: ''
                  - id: 0063e741c1f9
                    name: whoami
                    image: node:lts-alpine
                    status: Stopped · 38s ago
                    state: exited
                    ports: ''
                  - id: 3bf9c444b8db
                    name: web
                    image: node:lts-alpine
                    status: Running · 51s
                    state: running
                    ports: 0.0.0.0:8610->18610/tcp, [::]:8610->18610/tcp
                  - id: a022d81b0f81
                    name: hook
                    image: node:lts-alpine
                    status: Running · 47m
                    state: running
                    ports: ''
                  - id: f32260339376
                    name: gitea
                    image: imgproxy:1
                    status: Running · 45m
                    state: running
                    ports: 18610/tcp, 0.0.0.0:8611->3000/tcp, [::]:8611->3000/tcp
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/docker/stats:
    get:
      tags:
        - Docker
      operationId: getContainerStats
      summary: Get container stats
      description: Returns a one-shot CPU, memory, network and disk reading for each running container. Values are the strings Docker prints, such as `0.00%` and `10.96MiB / 7.755GiB`.
      x-protection: none
      parameters:
        - $ref: '#/components/parameters/Server'
      responses:
        '200':
          description: 'The readings, or `available: false` when Docker is not reachable. The example is shortened.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerStatsList'
              example:
                available: true
                stats:
                  - id: 986579b4a954
                    name: romantic_zhukovsky
                    cpu_percent: 0.00%
                    mem_usage: 116KiB / 7.755GiB
                    mem_percent: 0.00%
                    net_io: 2.95kB / 126B
                    block_io: 0B / 4.1kB
                    pids: '0'
                  - id: 3bf9c444b8db
                    name: web
                    cpu_percent: 0.00%
                    mem_usage: 10.93MiB / 7.755GiB
                    mem_percent: 0.14%
                    net_io: 1.36kB / 126B
                    block_io: 0B / 0B
                    pids: '7'
                  - id: a022d81b0f81
                    name: hook
                    cpu_percent: 0.00%
                    mem_usage: 11.75MiB / 7.755GiB
                    mem_percent: 0.15%
                    net_io: 0B / 0B
                    block_io: 81.9kB / 0B
                    pids: '7'
                  - id: f32260339376
                    name: gitea
                    cpu_percent: 0.00%
                    mem_usage: 11.61MiB / 7.755GiB
                    mem_percent: 0.15%
                    net_io: 2.24kB / 606B
                    block_io: 0B / 0B
                    pids: '7'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/docker/{name}/restart:
    post:
      tags:
        - Docker
      operationId: restartContainer
      summary: Restart container
      description: 'Restarts one container. Protection: token. Starting the container again undoes it, so no confirmation is asked.'
      x-protection: token
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          description: The container `name`, from [List containers](/reference/api/docker/list-containers).
          schema:
            type: string
            example: web
      responses:
        '200':
          description: The container restarted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerActionResult'
              example:
                action: restart
                container: web
                status: ok
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotRegistered'
        '500':
          description: Docker refused, for example because no container has this name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'failed to restart missing: Error response from daemon: No such container: missing'
  /api/docker/{name}/stop:
    post:
      tags:
        - Docker
      operationId: stopContainer
      summary: Stop container
      description: 'Stops one container. Protection: token and `confirm: true` in the body. A missing or non-boolean `confirm` returns `400`, and the string `"true"` does not count.'
      x-protection: token+confirm
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          description: The container `name`, from [List containers](/reference/api/docker/list-containers).
          schema:
            type: string
            example: whoami
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
            example:
              confirm: true
      responses:
        '200':
          description: The container stopped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerActionResult'
              example:
                action: stop
                container: whoami
                status: ok
        '400':
          description: '`confirm` was missing or was not the boolean `true`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                no-body:
                  summary: no body
                  value:
                    error: 'docker_stop stops a running service: send confirm=true to say that is what you meant'
                string-true:
                  summary: string true
                  value:
                    error: 'docker_stop stops a running service: send confirm=true to say that is what you meant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotRegistered'
        '500':
          description: Docker refused, for example because no container has this name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'failed to stop missing: Error response from daemon: No such container: missing'
  /api/alerts:
    get:
      tags:
        - Watch and alerts
      operationId: checkAlerts
      summary: Check alerts
      description: 'Compares CPU, memory and each disk with the thresholds in `alerts:` of your config. It reads and compares only: nothing is sent and nothing is recorded.'
      x-protection: none
      parameters:
        - $ref: '#/components/parameters/Server'
      responses:
        '200':
          description: Each reading with its threshold and a status of `ok`, `warning` or `critical`. The example is shortened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResult'
              example:
                cpu:
                  status: ok
                  current: 15.8
                  threshold: 90
                memory:
                  status: ok
                  current: 36.43
                  threshold: 85
                disks:
                  - mount: /
                    status: ok
                    current: 7
                    threshold: 90
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: The readings could not be taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: <message>
  /api/watch:
    get:
      tags:
        - Watch and alerts
      operationId: getWatch
      summary: Get watch list
      description: Returns the watch list, whether a service is installed to poll it, and how many incidents are kept. The three come in one response because a list with no service polling it records nothing.
      x-protection: none
      responses:
        '200':
          description: The targets, the service and the retention.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchOverview'
              example:
                targets:
                  - container: flaky
                    kind: docker
                    unit: flaky
                    added_at: '2026-10-25T11:58:28.036439838-07:00'
                service:
                  installed: false
                  unit: /home/you/.config/systemd/user/dev.homebutler.watch.service
                retention:
                  kept: 0
                  max: 200
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: The watch directory could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: <message>
  /api/watch/incidents:
    get:
      tags:
        - Watch and alerts
      operationId: listIncidents
      summary: List incidents
      description: 'Lists recorded incidents, newest first. The list leaves out the captured logs: `pre_logs` and `post_logs` are empty strings. Fetch one incident with [Get incident](/reference/api/watch-and-alerts/get-incident) to read them.'
      x-protection: none
      parameters:
        - name: limit
          in: query
          description: The most incidents to return. A value below 1 or one that is not a number is ignored, and the default applies.
          schema:
            type: integer
            minimum: 1
            default: 25
        - name: container
          in: query
          description: Return only incidents for this watch target.
          schema:
            type: string
            example: flaky
      responses:
        '200':
          description: The incidents, or an empty array when nothing was recorded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Incident'
              example:
                - id: flaky-20261025-115840.172-50551e
                  container: flaky
                  detected_at: '2026-10-25T11:58:40.172139897-07:00'
                  restart_count: 6
                  prev_started_at: '2026-10-25T18:58:24.350797511Z'
                  curr_started_at: '2026-10-25T18:58:35.810745971Z'
                  pre_logs: ''
                  post_logs: ''
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: The watch directory could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: <message>
  /api/watch/incidents/{id}:
    get:
      tags:
        - Watch and alerts
      operationId: getIncident
      summary: Get incident
      description: Returns one incident with the logs captured when the restart was detected.
      x-protection: none
      parameters:
        - name: id
          in: path
          required: true
          description: The incident `id`, from [List incidents](/reference/api/watch-and-alerts/list-incidents).
          schema:
            type: string
            example: flaky-20261025-113501.277-3c009f
      responses:
        '200':
          description: The incident with its logs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
              example:
                id: flaky-20261025-115840.172-50551e
                container: flaky
                detected_at: '2026-10-25T11:58:40.172139897-07:00'
                restart_count: 6
                prev_started_at: '2026-10-25T18:58:24.350797511Z'
                curr_started_at: '2026-10-25T18:58:35.810745971Z'
                pre_logs: (captured at detection — see post_logs for current state)
                post_logs: |-
                  booting
                  fatal: out of cheese
                  booting
                  fatal: out of cheese
                  booting
                  fatal: out of cheese
                  booting
                  fatal: out of cheese
                  booting
                  fatal: out of cheese
                  booting
                  fatal: out of cheese
                  booting
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No recorded incident has this `id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: incident "nope" not found
  /api/watch/targets:
    post:
      tags:
        - Watch and alerts
      operationId: addWatchTarget
      summary: Add watch target
      description: 'Adds a container, systemd unit or pm2 app to the watch list. Protection: token. Adding a name that is already listed returns `added: false` and changes nothing. The route does not check `kind` against the three values. An unknown value is accepted and echoed back, and every later read of the list treats it as `docker`.'
      x-protection: token
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchAddRequest'
            example:
              container: flaky
      responses:
        '200':
          description: The target was added, or was already on the list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchAddResult'
              examples:
                added:
                  summary: added
                  value:
                    added: true
                    container: flaky
                    kind: docker
                already-listed:
                  summary: already listed
                  value:
                    added: false
                    container: flaky
                    kind: docker
        '400':
          description: '`container` is missing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: container is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotRegistered'
        '500':
          description: The watch directory could not be written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: <message>
  /api/watch/targets/{name}/remove:
    post:
      tags:
        - Watch and alerts
      operationId: removeWatchTarget
      summary: Remove watch target
      description: 'Removes a target from the watch list. Protection: token. Recorded incidents stay.'
      x-protection: token
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          description: The `container` of a target, from [Get watch list](/reference/api/watch-and-alerts/get-watch-list).
          schema:
            type: string
            example: flaky
      responses:
        '200':
          description: The target was removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchRemoveResult'
              example:
                container: flaky
                removed: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 'The target is not on the watch list. When the server has no token, the route is not registered and answers `{"error": "no such endpoint"}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not-listed:
                  summary: not listed
                  value:
                    error: flaky is not on the watch list
                no-token-configured:
                  summary: no token configured
                  value:
                    error: no such endpoint
        '500':
          description: The watch directory could not be written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: <message>
  /api/watch/check:
    post:
      tags:
        - Watch and alerts
      operationId: runWatchCheck
      summary: Run watch check
      description: 'Inspects every Docker target on the watch list once and records an incident for each one that restarted since the last check. Protection: token. Adding a container that already exists records its state, so its first check compares against that state. The first check of a container that did not exist when it was added sets its baseline and records nothing. Targets of another kind appear in `skipped`, because a one-shot check inspects Docker only.'
      x-protection: token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: How many targets were checked, and the incidents this check recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchRunResult'
              example:
                checked: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotRegistered'
        '500':
          description: The watch state could not be read or saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: <message>
  /api/backup:
    get:
      tags:
        - Backups
      operationId: listBackups
      summary: List backups
      description: Lists the archives in your backup directory. Use an archive `path` as the `archive` field of [Restore backup](/reference/api/backups/restore-backup) and [Run backup drill](/reference/api/backups/run-backup-drill).
      x-protection: none
      responses:
        '200':
          description: The archives, or an empty array when there are none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BackupListEntry'
              example:
                - name: backup_2026-10-25_115840.971.tar.gz
                  path: /home/you/backups/backup_2026-10-25_115840.971.tar.gz
                  size: 1.7 KB
                  created_at: '2026-10-25T11:58:42-07:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: The backup directory could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: <message>
    post:
      tags:
        - Backups
      operationId: createBackup
      summary: Create backup
      description: 'Archives the volumes of the Docker compose services that are running, into your backup directory. Protection: token. Volumes are read while the containers run, so an archive is not proof it restores: [Run backup drill](/reference/api/backups/run-backup-drill) is.'
      x-protection: token
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupRequest'
            example:
              service: gitea
              exclude:
                - /nonexistent
      responses:
        '200':
          description: The archive that was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupResult'
              example:
                archive: /home/you/backups/backup_2026-10-25_115840.971.tar.gz
                services:
                  - gitea
                volumes: 1
                size: 1.7 KB
                unmatched_excludes:
                  - /nonexistent
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotRegistered'
        '500':
          description: The backup failed, for example because no compose project has the service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: service "missing" not found in any compose project
  /api/backup/drill:
    post:
      tags:
        - Backups
      operationId: runBackupDrill
      summary: Run backup drill
      description: 'Proves an archive restores. The drill checks the archive, boots the app from its data on an isolated network and a free port, and asks the app''s health endpoint for an answer. Protection: token. Without `app`, the drill runs for every app in the archive that has a health check. Without `archive`, it uses the newest archive.'
      x-protection: token
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DrillRequest'
            example:
              app: gitea
              archive: /home/you/backups/backup_2026-10-25_115840.971.tar.gz
      responses:
        '200':
          description: 'One result when you name an app, or a report with a `results` array when you do not. A drill that ran and failed is still `200`: read `passed` and `error`.'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DrillResult'
                  - $ref: '#/components/schemas/DrillReport'
              examples:
                one-app:
                  summary: one app
                  value:
                    app: gitea
                    archive: /home/you/backups/backup_2026-10-25_115840.971.tar.gz
                    size: 1.7 KB
                    file_count: 9
                    integrity: true
                    booted: true
                    boot_seconds: 0
                    health_status: 200
                    health_port: '41397'
                    passed: true
                    total_seconds: 3
                    drilled_at: '2026-10-25T18:58:42Z'
                all-apps:
                  summary: all apps
                  value:
                    results:
                      - app: gitea
                        archive: /home/you/backups/backup_2026-10-25_115840.971.tar.gz
                        size: 1.7 KB
                        file_count: 9
                        integrity: true
                        booted: true
                        boot_seconds: 0
                        health_status: 200
                        health_port: '32851'
                        passed: true
                        total_seconds: 3
                        drilled_at: '2026-10-25T18:58:46Z'
                    total: 1
                    passed: 1
                    failed: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotRegistered'
        '500':
          description: The drill could not start, for example because the app has no health check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: no health check defined for "missing"
  /api/backup/restore:
    post:
      tags:
        - Backups
      operationId: restoreBackup
      summary: Restore backup
      description: 'Writes the volumes in an archive back to the machine, replacing the data in them. Protection: token and `confirm_name` equal to `archive`. The restore refuses bind mounts that the archive declares: they come back in `refused` and nothing is written to them.'
      x-protection: token+confirm_name
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreRequest'
            example:
              archive: /home/you/backups/backup_2026-10-25_115840.971.tar.gz
              service: gitea
              confirm_name: /home/you/backups/backup_2026-10-25_115840.971.tar.gz
      responses:
        '200':
          description: The services and volumes that were restored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreResult'
              example:
                archive: /home/you/backups/backup_2026-10-25_115840.971.tar.gz
                services:
                  - gitea
                volumes: 1
        '400':
          description: '`confirm_name` is missing or does not equal `archive`. The message repeats the value to send.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                no-confirm:
                  summary: no confirm
                  value:
                    error: 'backup_restore cannot be undone: send confirm_name="/home/you/backups/backup_2026-10-25_115840.971.tar.gz" to say that is the one you meant'
                wrong-name:
                  summary: wrong name
                  value:
                    error: 'backup_restore cannot be undone: send confirm_name="/home/you/backups/backup_2026-10-25_115840.971.tar.gz" to say that is the one you meant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotRegistered'
        '500':
          description: The restore failed, for example because the archive does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'archive not found: /home/you/backups/none.tar.gz'
  /api/install:
    get:
      tags:
        - Install
      operationId: listApps
      summary: List apps
      description: Lists the apps homebutler can install. Use a `name` from this list as the `app` path parameter of the other install routes.
      x-protection: none
      responses:
        '200':
          description: The catalogue. The example is shortened.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstallApp'
              example:
                - name: pi-hole
                  description: Network-wide ad blocking via DNS filtering
                  default_port: '8088'
                  container_port: '80'
                  data_path: /etc/pihole
                - name: vaultwarden
                  description: Lightweight Bitwarden-compatible password manager
                  default_port: '8080'
                  container_port: '80'
                  data_path: /data
                - name: jellyfin
                  description: Free software media system for streaming movies, TV, and music
                  default_port: '8096'
                  container_port: '8096'
                  data_path: /config
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/install/{app}:
    get:
      tags:
        - Install
      operationId: getAppStatus
      summary: Get app status
      description: 'Returns whether one catalogue app is installed and, when it is, whether its containers are running. An app that was never installed answers `installed: false` with status `200`.'
      x-protection: none
      parameters:
        - $ref: '#/components/parameters/App'
      responses:
        '200':
          description: The install state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallStatus'
              examples:
                installed:
                  summary: installed
                  value:
                    app: it-tools
                    installed: true
                    state: running
                not-installed:
                  summary: not installed
                  value:
                    app: it-tools
                    installed: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The catalogue has no app with this name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: unknown app nope
        '500':
          description: The state of the app could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: <message>
    post:
      tags:
        - Install
      operationId: installApp
      summary: Install app
      description: 'Writes the app''s compose file under `~/.homebutler/apps/<app>` and starts it. Protection: token. A failed pre-flight check, such as a port that is taken, returns `200` with `status` set to `failed` and the reasons in `issues`, so you can change the port and ask again.'
      x-protection: token
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/App'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallRequest'
            example:
              port: '18620'
      responses:
        '200':
          description: '`status` is `installed`, or `failed` with `issues`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallResult'
              examples:
                installed:
                  summary: installed
                  value:
                    status: installed
                    app: it-tools
                    port: '18620'
                    path: /home/you/.homebutler/apps/it-tools
                    state: running
                port-in-use:
                  summary: port in use
                  value:
                    status: failed
                    app: it-tools
                    issues:
                      - |-
                        port 8620 is already in use by in use.
                            Use --port <number> to pick a different port
                      - |-
                        it-tools is already running.
                            Run: homebutler install uninstall it-tools
                    port: '18620'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 'The catalogue has no app with this name. When the server has no token, the route is not registered and answers `{"error": "no such endpoint"}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unknown-app:
                  summary: unknown app
                  value:
                    error: unknown app "nope"
                no-token-configured:
                  summary: no token configured
                  value:
                    error: no such endpoint
        '500':
          description: Docker compose failed to start the app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: <message>
  /api/install/{app}/uninstall:
    post:
      tags:
        - Install
      operationId: uninstallApp
      summary: Uninstall app
      description: 'Stops the app and removes its containers. The app''s data stays on disk, and installing again picks it up. Protection: token.'
      x-protection: token
