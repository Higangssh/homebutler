name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # MCP Registry OIDC login

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build web frontend
        run: make build-web

      - name: Run tests
        run: go test ./...

      # Everything the registry can reject runs before anything is published.
      # The publish itself has to stay at the end - the registry reads mcpName
      # back out of the npm package - so a rejection there costs a tag and
      # cannot be retried. v0.21.0 and v0.21.1 were both spent that way.
      - name: Validate the registry manifest
        run: |
          TAG=${GITHUB_REF#refs/tags/v}

          # The registry grants io.github.<login>/* from the OIDC token and
          # keeps the login's casing, and it matches the npm package's mcpName
          # against the server name. Checked against the real owner rather
          # than anything the repository declares about itself.
          WANT="io.github.${GITHUB_REPOSITORY%%/*}/${GITHUB_REPOSITORY##*/}"
          for file_field in "server.json:.name" "npm/package.json:.mcpName"; do
            file=${file_field%%:*}
            got=$(jq -r "${file_field##*:}" "$file")
            if [ "$got" != "$WANT" ]; then
              echo "::error file=$file::expected $WANT, found $got"
              exit 1
            fi
          done

          # Staged outside the checkout: GoReleaser refuses to run on a dirty
          # tree, so nothing here may leave a modified or untracked file behind.
          # Publishing later from this same directory also means the bytes that
          # were validated are the bytes that go to the registry.
          mkdir -p "$RUNNER_TEMP/registry"

          # Both fields have to carry the tag: the registry rejects a server
          # version whose package version does not exist on npm.
          jq --arg v "$TAG" '.version = $v | .packages[0].version = $v' \
            server.json > "$RUNNER_TEMP/registry/server.json"

          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz -C "$RUNNER_TEMP/registry" mcp-publisher

          cd "$RUNNER_TEMP/registry"
          ./mcp-publisher validate

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN not set, skipping tap update"
            exit 0
          fi

          TAG=${GITHUB_REF#refs/tags/v}
          REPO="Higangssh/homebutler"
          TAP_REPO="Higangssh/homebrew-homebutler"

          # Download checksums
          CHECKSUMS_URL="https://github.com/${REPO}/releases/download/v${TAG}/checksums.txt"
          curl -sL "$CHECKSUMS_URL" -o checksums.txt

          # Extract sha256 for each platform
          SHA_DARWIN_ARM64=$(grep "darwin_arm64" checksums.txt | awk '{print $1}')
          SHA_DARWIN_AMD64=$(grep "darwin_amd64" checksums.txt | awk '{print $1}')
          SHA_LINUX_ARM64=$(grep "linux_arm64" checksums.txt | awk '{print $1}')
          SHA_LINUX_AMD64=$(grep "linux_amd64" checksums.txt | awk '{print $1}')

          # Generate formula
          cat > homebutler.rb << EOF
          class Homebutler < Formula
            desc "Homelab butler in a single binary — manage servers from chat"
            homepage "https://github.com/${REPO}"
            version "${TAG}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/${REPO}/releases/download/v${TAG}/homebutler_${TAG}_darwin_arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              end
              on_intel do
                url "https://github.com/${REPO}/releases/download/v${TAG}/homebutler_${TAG}_darwin_amd64.tar.gz"
                sha256 "${SHA_DARWIN_AMD64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/${REPO}/releases/download/v${TAG}/homebutler_${TAG}_linux_arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              end
              on_intel do
                url "https://github.com/${REPO}/releases/download/v${TAG}/homebutler_${TAG}_linux_amd64.tar.gz"
                sha256 "${SHA_LINUX_AMD64}"
              end
            end

            def install
              bin.install "homebutler"
            end

            test do
              assert_match "homebutler", shell_output("#{bin}/homebutler version")
            end
          end
          EOF

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' homebutler.rb

          # Push to tap repo
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          cp homebutler.rb tap/homebutler.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add homebutler.rb
          git commit -m "chore: update homebutler to ${TAG}" || exit 0
          git push

      - name: Publish npm wrapper
        id: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN not set, skipping npm publish"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG=${GITHUB_REF#refs/tags/v}
          cd npm
          npm version "$TAG" --no-git-tag-version --allow-same-version
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          npm publish --access public
          rm .npmrc
          echo "published=true" >> "$GITHUB_OUTPUT"

      # The registry stores metadata only. It verifies ownership by reading the
      # mcpName field back out of the published npm package, so this cannot run
      # before the npm publish above succeeds. The manifest was stamped and
      # validated before anything was published; this publishes that same copy.
      - name: Publish to MCP Registry
        if: steps.npm.outputs.published == 'true'
        run: |
          cd "$RUNNER_TEMP/registry"
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
