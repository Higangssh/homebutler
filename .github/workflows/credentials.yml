name: Credentials

# Checks the release's secrets without cutting a tag. Run it from the Actions
# tab after replacing NPM_TOKEN or HOMEBREW_TAP_TOKEN: release.yml only runs on
# a tag, so nothing else tells you a new secret works before a release depends
# on it. The release runs the same script before it publishes anything.
#
# It also runs weekly. A token that expires (npm's write tokens last at most
# 90 days) then shows up as a failed run that week, rather than as a release
# that stops half published. Drop the schedule once npm publishing moves to
# trusted publishing (#318) and there is no token left to expire.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * 1" # Mondays 00:17 UTC

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check the release credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: scripts/check-credentials.sh
