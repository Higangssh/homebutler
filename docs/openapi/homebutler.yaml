          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                no-confirm:
                  summary: no confirm
                  value:
                    error: 'install_purge cannot be undone: send confirm_name="it-tools" to say that is the one you meant'
                wrong-name:
                  summary: wrong name
                  value:
                    error: 'install_purge cannot be undone: send confirm_name="it-tools" to say that is the one you meant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotRegistered'
        '500':
          description: The app is not installed, or Docker compose failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: <message>
  /api/proxmox/endpoints:
    get:
      tags:
        - Proxmox
      operationId: listProxmoxEndpoints
      summary: List Proxmox endpoints
      description: Lists the Proxmox VE endpoints in your configuration. Use a `name` as the `endpoint` query parameter on the other Proxmox routes. With one endpoint configured, the other routes need no `endpoint`.
      x-protection: none
      responses:
        '200':
          description: The endpoint names.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProxmoxEndpoint'
              example:
                - name: pve
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/proxmox/status:
    get:
      tags:
        - Proxmox
      operationId: getProxmoxStatus
      summary: Get Proxmox status
      description: Reads the version, cluster, nodes, guests and storage of one Proxmox VE endpoint with its read-only token. When the endpoint cannot be read, the route answers `200` with `status` set to `stale` and the last reading, or `unavailable` and empty lists when there has been none.
      x-protection: none
      parameters:
        - $ref: '#/components/parameters/Endpoint'
      responses:
        '200':
          description: The reading and how current it is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxmoxStatus'
              example:
                version:
                  version: ''
                  release: ''
                cluster: []
                resources:
                  nodes: []
                  guests: []
                  storage: []
                failed_collectors:
                  - version
                  - cluster
                  - resources
                failure_classes:
                  cluster: transport
                  resources: transport
                  version: transport
                status: unavailable
                failure_class: transport
        '400':
          description: '`endpoint` names no configured endpoint, or several are configured and none was named.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'proxmox endpoint "nope" not found in config. Available endpoints: [pve]'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/proxmox/guests:
    get:
      tags:
        - Proxmox
      operationId: listProxmoxGuests
      summary: List Proxmox guests
      description: Lists the virtual machines and containers on an endpoint. Use `vmid`, `node` and `type` from an entry in the guest action routes. The filters combine.
      x-protection: none
      parameters:
        - $ref: '#/components/parameters/Endpoint'
        - name: node
          in: query
          description: Return only guests on this node.
          schema:
            type: string
            example: pve
        - name: status
          in: query
          description: Return only guests with this status, such as `running` or `stopped`.
          schema:
            type: string
            example: running
        - name: type
          in: query
          description: Return only guests of this type.
          schema:
            type: string
            enum:
              - qemu
              - lxc
      responses:
        '200':
          description: The matching guests.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProxmoxGuest'
              example: No example captured. This response needs a condition the test server could not produce.
        '400':
          description: '`endpoint` names no configured endpoint, or its credentials are missing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'proxmox endpoint "nope" not found in config. Available endpoints: [pve]'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: The endpoint did not answer. The message is the request error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'proxmox request /api2/json/cluster/resources: Get "https://127.0.0.1:8699/api2/json/cluster/resources": dial tcp 127.0.0.1:8699: connect: connection refused'
  /api/proxmox/guests/{vmid}/start:
    post:
      tags:
        - Proxmox
      operationId: startProxmoxGuest
      summary: Start Proxmox guest
      description: 'Starts a guest with the endpoint''s action token. Protection: token. Proxmox runs the start as a task, and the route returns once Proxmox accepts it, with the task id in `upid`. Without an action token on the endpoint the route answers `400`: it never falls back to the read-only token.'
      x-protection: token
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Vmid'
        - $ref: '#/components/parameters/Endpoint'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestActionRequest'
            example:
              node: pve
              type: qemu
      responses:
        '200':
          description: Proxmox accepted the task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestActionResult'
              example: No example captured. This response needs a condition the test server could not produce.
        '400':
          description: '`node` or `type` is missing, `vmid` is not a number, or the endpoint or its action token is not configured.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                no-node:
                  summary: no node
                  value:
                    error: 'node and type are required: a guest is addressed explicitly, never guessed'
                bad-vmid:
                  summary: bad vmid
                  value:
                    error: vmid must be a number
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotRegistered'
        '500':
          description: Proxmox did not answer or refused. The message is the request error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'proxmox request /api2/json/nodes/pve/qemu/100/status/start: Post "https://127.0.0.1:8699/api2/json/nodes/pve/qemu/100/status/start": dial tcp 127.0.0.1:8699: connect: connection refused'
  /api/proxmox/guests/{vmid}/reboot:
    post:
      tags:
        - Proxmox
      operationId: rebootProxmoxGuest
      summary: Reboot Proxmox guest
      description: 'Reboots a guest with the endpoint''s action token. Protection: token. The guest comes back by itself, so no confirmation is asked. The route returns once Proxmox accepts the task.'
      x-protection: token
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Vmid'
        - $ref: '#/components/parameters/Endpoint'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestActionRequest'
            example:
              node: pve
              type: qemu
      responses:
        '200':
          description: Proxmox accepted the task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestActionResult'
              example: No example captured. This response needs a condition the test server could not produce.
        '400':
          description: '`node` or `type` is missing, `vmid` is not a number, or the endpoint or its action token is not configured.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'node and type are required: a guest is addressed explicitly, never guessed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotRegistered'
        '500':
          description: Proxmox did not answer or refused. The message is the request error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'proxmox request /api2/json/nodes/pve/qemu/100/status/reboot: Post "https://127.0.0.1:8699/api2/json/nodes/pve/qemu/100/status/reboot": dial tcp 127.0.0.1:8699: connect: connection refused'
  /api/proxmox/guests/{vmid}/shutdown:
    post:
      tags:
        - Proxmox
      operationId: shutdownProxmoxGuest
      summary: Shut down Proxmox guest
      description: 'Asks a guest to shut down with the endpoint''s action token. Protection: token and `confirm: true` in the body. The route returns once Proxmox accepts the task.'
      x-protection: token+confirm
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Vmid'
        - $ref: '#/components/parameters/Endpoint'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestShutdownRequest'
            example:
              node: pve
              type: qemu
              confirm: true
      responses:
        '200':
          description: Proxmox accepted the task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestActionResult'
              example: No example captured. This response needs a condition the test server could not produce.
        '400':
          description: '`confirm` is not `true`, `node` or `type` is missing, `vmid` is not a number, or the endpoint or its action token is not configured.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                no-confirm:
                  summary: no confirm
                  value:
                    error: 'proxmox_guest_shutdown stops a running service: send confirm=true to say that is what you meant'
                no-node:
                  summary: no node
                  value:
                    error: 'node and type are required: a guest is addressed explicitly, never guessed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotRegistered'
        '500':
          description: Proxmox did not answer or refused. The message is the request error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'proxmox request /api2/json/nodes/pve/qemu/100/status/shutdown: Post "https://127.0.0.1:8699/api2/json/nodes/pve/qemu/100/status/shutdown": dial tcp 127.0.0.1:8699: connect: connection refused'
  /api/wake:
    get:
      tags:
        - Wake and notify
      operationId: listWakeTargets
      summary: List wake targets
      description: Lists the machines in `wake:` of your config. Use a `name` as the path parameter of [Send wake packet](/reference/api/wake-and-notify/send-wake-packet).
      x-protection: none
      responses:
        '200':
          description: The wake targets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WakeTarget'
              example:
                - mac: AA:BB:CC:DD:EE:FF
                  name: desktop
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/wake/{name}:
    post:
      tags:
        - Wake and notify
      operationId: sendWakePacket
      summary: Send wake packet
      description: 'Sends a Wake-on-LAN magic packet to one target. Protection: token. A target without a broadcast address in the config uses `255.255.255.255`.'
      x-protection: token
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          description: The wake target `name`, from [List wake targets](/reference/api/wake-and-notify/list-wake-targets).
          schema:
            type: string
            example: desktop
      responses:
        '200':
          description: The packet was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WakeResult'
              example:
                action: wake
                mac: AA:BB:CC:DD:EE:FF
                broadcast: 127.0.0.255
                status: sent
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 'No wake target has this name. When the server has no token, the route is not registered and answers `{"error": "no such endpoint"}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unknown-target:
                  summary: unknown target
                  value:
                    error: wake target "nope" not found
                no-token-configured:
                  summary: no token configured
                  value:
                    error: no such endpoint
        '500':
          description: The packet could not be sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: <message>
  /api/notify/test:
    post:
      tags:
        - Wake and notify
      operationId: sendTestNotification
      summary: Send test notification
      description: 'Sends one real test message through every configured notification channel. Protection: token. A channel that fails is a result with `sent` set to `false` and an `error`, not an error response, so one broken channel does not hide the others.'
      x-protection: token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: One result per configured channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotifyTestResponse'
              example:
                results:
                  - channel: webhook
                    sent: true
                  - channel: ntfy
                    sent: true
        '400':
          description: No notification channel is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: no notification channel is configured yet
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotRegistered'
  /api/config:
    get:
      tags:
        - Config
      operationId: getConfig
      summary: Get config
      description: 'Returns the settings the dashboard shows: servers, Proxmox endpoints, alert thresholds, wake targets and notification channels. Secrets are never returned. A credential appears as a `set` flag, and a notification field that is not a secret appears with its `value`. When the server has a token, the response carries a `revision` to send back with a save.'
      x-protection: none
      responses:
        '200':
          description: The current settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
              example:
                alerts:
                  cpu: 90
                  disk: 90
                  memory: 85
                editable: true
                notify:
                  - channel: telegram
                    configured: false
                    fields:
                      - name: bot_token
                        secret: true
                        set: false
                      - name: chat_id
                  - channel: slack
                    configured: false
                    fields:
                      - name: webhook_url
                        secret: true
                        set: false
                  - channel: discord
                    configured: false
                    fields:
                      - name: webhook_url
                        secret: true
                        set: false
                  - channel: webhook
                    configured: true
                    fields:
                      - name: url
                        secret: true
                        set: true
                  - channel: ntfy
                    configured: false
                    fields:
                      - name: url
                      - name: topic
                        secret: true
                        set: false
                      - name: token
                        secret: true
                        optional: true
                        set: false
                  - channel: gotify
                    configured: false
                    fields:
                      - name: url
                      - name: token
                        secret: true
                        set: false
                path: /home/you/.config/homebutler/config.yaml
                proxmox:
                  - action_token_id: power@pve!action
                    action_token_in_file: false
                    action_token_set: true
                    host: 127.0.0.1
                    name: pve
                    port: 8699
                    token_id: monitoring@pve!readonly
                    token_in_file: false
                    token_set: true
                revision: 5dc27a5248d989362c784ef6616e8bcd949b22c5d7ff8ae1a1d3ff022a5ad009
                servers:
                  - auth: key
                    host: 192.168.1.10
                    key: ''
                    local: true
                    name: homelab
                    password_set: false
                    port: 0
                    user: ''
                  - auth: key
                    host: 192.0.2.10
                    key: ''
                    local: false
                    name: nas
                    password_set: false
                    port: 0
                    user: admin
                transport_warning: ''
                wake:
                  - broadcast: 127.0.0.255
                    mac: AA:BB:CC:DD:EE:FF
                    name: desktop
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/config/alerts:
    put:
      tags:
        - Config
      operationId: saveAlerts
      summary: Save alert thresholds
      description: 'Changes the CPU, memory or disk threshold in the config file. Protection: token. Send the `revision` from [Get config](/reference/api/config/get-config). A save changes only the fields you send. A running `watch` or `alerts` process reads thresholds when it starts, so `restart_needed` names the ones to restart.'
      x-protection: token
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertsRequest'
            example:
              revision: de00b31a091f1c29664eba416271abe6acc33d96ed0dcf954cec6f9c0fd7cc9a
              cpu: 91
      responses:
        '200':
          description: The thresholds were saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveResponse'
              example:
                saved: true
                revision: e1f870168b857bb64a55869ef60c659e39e636a94198af3b51e47f63cbacadf2
                restart_needed:
                  - watch
                  - alerts
        '400':
          description: The body could not be read, the `revision` is missing, or no threshold was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                no-revision:
                  summary: no revision
                  value:
                    error: the request did not carry the revision it was made against
                nothing-to-change:
                  summary: nothing to change
                  value:
                    error: nothing to change
                unreadable:
                  summary: unreadable
                  value:
                    error: could not read the request
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotRegistered'
        '409':
          $ref: '#/components/responses/StaleRevision'
        '413':
          $ref: '#/components/responses/TooLarge'
  /api/config/notify:
