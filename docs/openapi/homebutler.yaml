                app: it-tools
                data_preserved: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotRegistered'
        '500':
          description: The app is not installed, or Docker compose failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: it-tools is not installed
  /api/install/{app}/purge:
    post:
      tags:
        - Install
      operationId: purgeApp
      summary: Purge app
      description: 'Removes the app''s containers and deletes its data volumes. The data does not come back. Protection: token and `confirm_name` equal to the `app` in the path.'
      x-protection: token+confirm_name
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/App'
      requestBody:
        required: true
        content:
          application/json:
