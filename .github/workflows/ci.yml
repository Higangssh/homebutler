name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a run be started by hand when GitHub never created one for a pull
  # request. That happened on #90: no run and no check suite existed for the
  # head commit, and the only way to get the required checks was to close and
  # reopen the pull request, which leaves a closed/reopened pair on a
  # contributor's timeline that reads like a rejection.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      # Pinned, not latest. A linter that upgrades itself means the build can
      # break on a day nobody touched the repository — and it did: a vet check
      # added in 2.12 rejected reflect.Ptr, which passed on the maintainer's
      # older local copy and failed here. Upgrading is a pull request, where
      # the new findings are somebody's decision rather than a surprise.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2

      # goreleaser's config is checked here rather than only at tag time. It
      # was already failing `check` on deprecated properties once, and nothing
      # said so until somebody ran it by hand — with `version: latest` on the
      # release job, that is a release breaking on a day we changed nothing.
      - name: Check the release config
        uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.1
          args: check

      # The release body is cut from the changelog at tag time, so a section
      # that cannot be cut is a release that fails. Finding that out here costs
      # a pull request; finding it out then costs the release.
      - name: Check the changelog can be cut into release notes
        run: |
          set -euo pipefail
          versions=$(grep -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ')
          for version in $versions; do
            scripts/release-notes.sh "$version" > /dev/null
          done

          # Every release opens with one bolded sentence naming the problem it
          # solves. Only the newest is checked: the convention started partway
          # through, and the releases before it are already published.
          newest=$(printf '%s\n' "$versions" | head -1)
          case "$(scripts/release-notes.sh "$newest" | head -1)" in
            '**'*) ;;
            *)
              echo "$newest does not open with the bolded sentence that names the problem it solves." >&2
              exit 1
              ;;
          esac

          # [Unreleased] is not checked above: the loop only matches version
          # headings. So a repeated section heading accumulates there quietly —
          # two `### 🐛 Fixes` from two pull requests — and release-notes.sh
          # cuts the section whole, so it reaches the release page as two
          # Fixes blocks. Until now the merge happened because a person did it
          # while preparing the release.
          # The heading itself first. Two [Unreleased] sections read as one
          # while nobody looks, and the check below never fires because the
          # repeated section headings are one in each block. The release PR
          # renames a heading, singular, so the second block would stay behind
          # and release-notes.sh — which cuts from the version heading to the
          # next `## [` — would end the notes there and publish half of them.
          count=$(grep -c '^## \[Unreleased\]' CHANGELOG.md || true)
          if [ "$count" -gt 1 ]; then
            echo "CHANGELOG.md has $count [Unreleased] headings; there can be one." >&2
            echo "The release notes are cut from a version heading to the next one, so the entries under the second would not be published." >&2
            exit 1
          fi

          duplicate=$(
            awk '/^## \[/ { inside = ($0 ~ /Unreleased/) } inside && /^### / { print }' CHANGELOG.md |
              sort | uniq -d
          )
          if [ -n "$duplicate" ]; then
            echo "[Unreleased] has the same section heading more than once:" >&2
            echo "$duplicate" >&2
            echo "Merge the entries under one heading — the release notes are cut from the section whole." >&2
            exit 1
          fi

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # No make build-web here: the suite serves the frontend with vite and
      # points it at a real `homebutler serve --demo`, so a component change
      # does not have to be built and embedded before it can be tested. The
      # embedded path is covered by the Go tests instead.
      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Install Chromium
        run: npx --prefix web playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm --prefix web run e2e

      - name: Upload the report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build web frontend
        run: make build-web

      # GoReleaser refuses to build from a dirty tree, and its error names the
      # file without saying which step wrote it. v0.36.0 was spent finding that
      # out: `make build-web` ran `npm install`, which rewrote the lockfile.
      - name: The build must not have written to the tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::building the frontend modified the working tree:"
            git status --short
            git diff
            exit 1
          fi

      - name: Test web frontend
        run: npm --prefix web test

      - name: Build
        run: go build ./...

      # One run, not two. The suite waits on real timeouts in internal/network
      # and internal/remote, so running it again only to measure it doubled the
      # slowest job in CI for a number that was then thrown away.
      - name: Test
        run: go test ./... -v -race -coverprofile=coverage.out

      # The number used to go to stdout of a job nobody opens. The summary is
      # on the checks page of the pull request that changed it.
      - name: Coverage
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}')
          echo "Total coverage: **$total**" >> "$GITHUB_STEP_SUMMARY"
          echo "total coverage: $total"

      # Coveralls holds the previous value, which is the part a log cannot do:
      # the delta arrives on the pull request while the diff that caused it is
      # still on screen.
      #
      # Skipped for pull requests from forks, where GITHUB_TOKEN is read-only
      # and the upload fails. A contributor's PR is not the place to turn a
      # coverage report into a red check.
      - name: Publish coverage
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.out
          format: golang

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build web frontend
        run: make build-web

      - name: Cross-compile
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -ldflags "-s -w" -o homebutler-${{ matrix.goos }}-${{ matrix.goarch }} .
