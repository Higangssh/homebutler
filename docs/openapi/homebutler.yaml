        '413':
          $ref: '#/components/responses/TooLarge'
  /api/capabilities:
    get:
      tags:
        - Meta
      operationId: listCapabilities
      summary: List capabilities
      description: 'Lists everything homebutler can do, with its risk class (`read`, `write` or `destructive`), what it can be pointed at, and the route that reaches it. A capability with no `method` and `path` has no route: `absent` says why.'
      x-protection: none
      responses:
        '200':
          description: The capabilities, sorted by name. The example is shortened.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Capability'
              example:
                - name: alerts
                  description: Check resource alerts for CPU, memory, and disk usage against configured thresholds. It reads and compares; nothing is sent anywhere and nothing is recorded, which is what a running watcher does instead
                  risk: read
                  targets:
                    - local
                    - server
                  method: GET
                  path: /api/alerts
                - name: alerts_history
                  description: Show recorded alert and remediation history. Entries are only written while a watcher is running, so an empty list means nothing was recording rather than nothing went wrong
                  risk: read
                  targets:
                    - local
                    - server
                  absent: no view built for it yet
                - name: backup_create
                  description: Create a Docker compose backup archive for all services or one service. Volumes are read while the containers run, so a database mid-write can land inconsistent; an archive is not evidence it restores, which is what backup_drill answers
                  risk: write
                  targets:
                    - local
                    - server
                  method: POST
                  path: /api/backup
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/version:
    get:
      tags:
        - Meta
      operationId: getVersion
      summary: Get version
      description: Returns the version of the running homebutler.
      x-protection: none
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
              example:
                version: 1.7.0
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/:
    options:
      tags:
        - Meta
      operationId: preflight
      summary: Answer a CORS preflight
      description: Answers a browser's CORS preflight for any `/api/` path. The route needs no token. For an `Origin` of `http://localhost:<port>`, `http://127.0.0.1:<port>` or `http://<host>:<port>` (the address the server is bound to), the response carries the `Access-Control-Allow-*` headers, and every other origin gets none. The same headers are added to a normal response from a route when the request has one of those origins. `Access-Control-Allow-Methods` lists `GET, POST, OPTIONS`, which leaves out `PUT`, the method of the config save routes.
      x-protection: none
      security: []
      parameters:
        - name: Origin
          in: header
          description: The origin of the page making the cross-origin request.
          schema:
            type: string
            example: http://localhost:8080
      responses:
        '204':
          description: No body. The allow headers are present only for a matching origin.
          headers:
            Access-Control-Allow-Origin:
              description: The request's `Origin`, echoed back.
              schema:
                type: string
            Access-Control-Allow-Methods:
              description: '`GET, POST, OPTIONS`. `PUT` is not in the list.'
              schema:
                type: string
            Access-Control-Allow-Headers:
              description: '`Content-Type, Authorization`.'
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'The token you start the server with: `homebutler serve --token <token>`, or `web.token` in the config file. Send it as `Authorization: Bearer <token>`. When the server has a token, every `/api/` route except the CORS preflight requires it, reads included.'
  parameters:
    Server:
      name: server
      in: query
      description: The `name` of a remote server from [List servers](/reference/api/overview-and-servers/list-servers). homebutler runs the command on it over SSH and returns its answer. Leave it out, name the local server, or name a server that is not in the config, to read this machine.
      schema:
        type: string
        example: nas
    Endpoint:
      name: endpoint
      in: query
      description: The `name` of a Proxmox endpoint from [List Proxmox endpoints](/reference/api/proxmox/list-proxmox-endpoints). Needed when more than one is configured.
      schema:
        type: string
        example: pve
    App:
      name: app
      in: path
      required: true
      description: The app `name` from [List apps](/reference/api/install/list-apps).
      schema:
        type: string
        example: it-tools
    Vmid:
      name: vmid
      in: path
      required: true
      description: The numeric guest id, from [List Proxmox guests](/reference/api/proxmox/list-proxmox-guests).
      schema:
        type: integer
        example: 100
  responses:
    Unauthorized:
      description: The server runs with a token, and the `Authorization` header is missing or does not match it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthorized
    NotRegistered:
      description: The server runs without a token, so this route does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: no such endpoint
    StaleRevision:
      description: The config file changed since the `revision` was issued, or the revision came from an earlier run of the server. Get the config again and resend.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: the config file changed on disk since this page loaded it; reload before saving
    TooLarge:
      description: The request body is larger than 1 MiB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: that is larger than a settings change should ever be
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: A sentence that says what went wrong.
    CPUInfo:
      type: object
      required:
        - usage_percent
        - cores
      properties:
        usage_percent:
          type: number
          description: CPU use in percent.
        cores:
          type: integer
          description: Number of CPU cores.
    MemInfo:
      type: object
      required:
        - total_gb
        - used_gb
        - usage_percent
      properties:
        total_gb:
          type: number
          description: Total memory in GB.
        used_gb:
          type: number
          description: Used memory in GB.
        usage_percent:
          type: number
          description: Memory use in percent.
    DiskInfo:
      type: object
      required:
        - mount
        - total_gb
        - used_gb
        - usage_percent
      properties:
        mount:
          type: string
          description: Mount point.
        total_gb:
          type: number
          description: Size in GB.
        used_gb:
          type: number
          description: Used space in GB.
        usage_percent:
          type: number
          description: Used space in percent.
    StatusInfo:
      type: object
      required:
        - hostname
        - os
        - arch
        - uptime
        - cpu
        - memory
        - disks
        - time
      properties:
        hostname:
          type: string
          description: Host name.
        os:
          type: string
          description: Operating system, such as `linux`.
        arch:
          type: string
          description: CPU architecture, such as `amd64`.
        uptime:
          type: string
          description: Time since boot, as text such as `15h 15m`.
        cpu:
          $ref: '#/components/schemas/CPUInfo'
        memory:
          $ref: '#/components/schemas/MemInfo'
        disks:
          type: array
          description: One entry per mounted disk.
          items:
            $ref: '#/components/schemas/DiskInfo'
        time:
          type: string
          description: The time of the reading, RFC 3339 with the machine's offset.
    StatusDoc:
      description: The system status document. It is frozen at schema version 1.
      allOf:
        - $ref: '#/components/schemas/StatusInfo'
        - type: object
          required:
            - schema_version
          properties:
            schema_version:
              type: integer
              description: The version of this document's shape. It is `1`.
    ServerInfo:
      type: object
      required:
        - name
        - host
        - local
      properties:
        name:
          type: string
          description: The server's name in your config.
        host:
          type: string
          description: The server's address.
        local:
          type: boolean
          description: '`true` for the machine homebutler runs on.'
    ServerReading:
      type: object
      required:
        - name
        - host
        - local
        - status
      properties:
        name:
          type: string
          description: The server's name in your config.
        host:
          type: string
          description: The server's address.
        local:
          type: boolean
          description: '`true` for the machine homebutler runs on.'
        status:
          type: string
          enum:
            - current
            - stale
            - unavailable
          description: '`current` is a reading taken now. `stale` is the last reading that worked, shown because a new one failed. `unavailable` means no reading has ever worked.'
        updated_at:
          type: string
          format: date-time
          description: When `system` was read. Absent when `status` is `unavailable`.
        system:
          $ref: '#/components/schemas/StatusInfo'
        failure_class:
          type: string
          enum:
            - unreachable
            - host_key
            - authentication
            - remote
          description: Why a new reading failed. Absent when `status` is `current`.
        message:
          type: string
          description: A sentence that describes the failure. Absent when `status` is `current`.
    Overview:
      type: object
      required:
        - collected_at
        - servers
      properties:
        collected_at:
          type: string
          format: date-time
          description: When this response was assembled.
        servers:
          type: array
          description: One entry per configured server, in configuration order.
          items:
            $ref: '#/components/schemas/ServerReading'
    ProcessInfo:
      type: object
      required:
        - pid
        - name
        - cpu
        - mem
        - rss
      properties:
        pid:
          type: integer
          description: Process id.
        name:
          type: string
          description: Process name.
        cpu:
          type: number
          description: CPU use in percent.
        mem:
          type: number
          description: Memory use in percent.
        rss:
          type: integer
          description: Resident memory in KB.
        state:
          type: string
          description: Process state letter, such as `R` or `S`.
        zombie:
          type: boolean
          description: '`true` for a zombie process.'
    PortInfo:
      type: object
      required:
        - protocol
        - address
        - port
      properties:
        protocol:
          type: string
          description: '`tcp`.'
        address:
          type: string
          description: The address the port listens on.
        port:
          type: string
          description: The port number.
        container:
          type: string
          description: The Docker container that publishes the port, as `name (image)`.
        pid:
          type: string
          description: The owning process id, when readable.
        process:
          type: string
          description: The owning process name, when readable.
    PortsResult:
      type: object
      required:
        - ports
      properties:
        ports:
          type: array
          items:
            $ref: '#/components/schemas/PortInfo'
          description: The listening ports.
        missing_process:
          type: boolean
          description: '`true` when the process behind some ports could not be read.'
    Finding:
      type: object
      required:
        - kind
        - text
      properties:
        kind:
          type: string
          description: What the finding is about, such as `disk` or `container`.
        target:
          type: string
          description: The disk, container or port it names.
        text:
          type: string
          description: A sentence for a person.
    ChangeLine:
      type: object
      required:
        - kind
        - target
        - text
      properties:
        kind:
          type: string
          enum:
            - gone
            - new
            - replaced
            - image
            - state
            - port
            - disk
            - skipped
          description: What changed.
        target:
          type: string
          description: What changed.
        detail:
          type: string
          description: The change, such as `running → exited`.
        text:
          type: string
          description: A sentence for a person.
    ReportAction:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          description: What to do.
        command:
          type: string
          description: The command that does it.
        runner:
          type: string
          enum:
            - mcp
            - cli
            - shell
          description: Where the command runs.
        tool:
          type: string
          description: The MCP tool that does it, when `runner` is `mcp`.
    Report:
      type: object
      required:
        - schema_version
        - timestamp
        - server_name
        - is_baseline
        - snapshot_saved
        - status
        - needs_attention
        - notable_changes
        - suggested_actions
        - running_count
        - stopped_count
        - public_port_count
      properties:
        schema_version:
          type: integer
          description: The version of this document's shape. It is `1`.
        timestamp:
          type: string
          description: When the report was built, RFC 3339 in UTC.
        server_name:
          type: string
          description: The name of the server the report is about.
        is_baseline:
          type: boolean
          description: '`true` when there was no snapshot to compare against.'
        snapshot_saved:
          type: boolean
          description: '`true` when this report was saved as the new snapshot.'
        compared_to:
          type: string
          description: The timestamp of the snapshot this report was compared with. Absent for a baseline.
        system:
          $ref: '#/components/schemas/StatusInfo'
        running_count:
          type:
            - integer
            - 'null'
          description: Running containers. `null` when Docker did not answer.
        stopped_count:
          type:
            - integer
            - 'null'
          description: Stopped containers. `null` when Docker did not answer.
        public_port_count:
          type:
            - integer
            - 'null'
          description: Ports open to the network. `null` when ports could not be listed.
        status:
          type: array
          items:
            type: string
          description: One sentence per measured area.
        needs_attention:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
          description: Problems found now.
        notable_changes:
          type: array
          items:
            $ref: '#/components/schemas/ChangeLine'
          description: Differences from the snapshot.
        suggested_actions:
          type: array
          items:
            $ref: '#/components/schemas/ReportAction'
          description: Next steps, each with the command that runs it.
        failed_collectors:
          type: array
          items:
            type: string
            enum:
              - docker
              - ports
              - processes
          description: The collectors that failed. A count is trustworthy only when its collector is absent here.
        warnings:
          type: array
          items:
            type: string
          description: Problems that did not stop the report, such as an unreadable snapshot.
    ReportResponse:
      description: The report plus a count of each list, for widgets that cannot take the length of an array.
      allOf:
        - $ref: '#/components/schemas/Report'
        - type: object
          required:
            - summary
          properties:
            summary:
              type: object
              required:
                - needs_attention
                - notable_changes
              description: The length of each list.
              properties:
                needs_attention:
                  type: integer
                  description: Length of `needs_attention`.
                notable_changes:
                  type: integer
                  description: Length of `notable_changes`.
    DoctorFinding:
      type: object
      required:
        - severity
        - category
        - title
      properties:
        severity:
          type: string
          enum:
            - pass
            - warn
            - fail
          description: How serious the finding is.
        category:
          type: string
          enum:
            - backup
            - config
            - docker
            - exposure
            - incomplete
            - notifications
            - overall
            - proxmox
            - report
            - system
            - watch
          description: The area the check belongs to.
        title:
          type: string
          description: What was found.
        detail:
          type: string
          description: The evidence.
        action:
          type: string
          description: What to do about it.
        command:
          type: string
          description: The command that does it.
        runner:
          type: string
          enum:
            - mcp
            - cli
            - shell
          description: Where the command runs.
        tool:
          type: string
          description: The MCP tool that does it, when `runner` is `mcp`.
    DoctorResult:
      type: object
      required:
        - schema_version
        - timestamp
        - server_name
        - status
        - summary
        - findings
      properties:
        schema_version:
          type: integer
          description: The version of this document's shape. It is `1`.
        timestamp:
          type: string
          description: When the checks ran, RFC 3339 in UTC.
        server_name:
          type: string
          description: The name of the server checked.
        status:
          type: string
          enum:
            - pass
            - warn
            - fail
          description: The worst severity among the findings.
        summary:
          type: object
          required:
            - pass
            - warn
            - fail
          description: The number of findings at each severity.
          properties:
            pass:
              type: integer
              description: Findings with severity `pass`.
            warn:
              type: integer
              description: Findings with severity `warn`.
            fail:
              type: integer
              description: Findings with severity `fail`.
        findings:
          type: array
          items:
            $ref: '#/components/schemas/DoctorFinding'
          description: One entry per check.
    Container:
      type: object
      required:
        - id
        - name
        - image
        - status
        - state
        - ports
      properties:
        id:
          type: string
          description: The short container id.
        name:
          type: string
          description: The container name.
        image:
          type: string
          description: The image the container runs.
        status:
          type: string
          description: A sentence with the state and its age, such as `Running · 5s`.
        state:
          type: string
          description: Docker's state word, such as `running` or `exited`.
        ports:
          type: string
          description: The published ports as text. Empty when none.
    ContainerList:
      type: object
      required:
        - available
        - containers
      properties:
        available:
          type: boolean
          description: '`false` when Docker did not answer.'
        message:
          type: string
          description: Why Docker is unavailable. Present only when `available` is `false`.
        containers:
          type: array
          items:
            $ref: '#/components/schemas/Container'
          description: The containers. Empty when Docker is unavailable.
    ContainerStats:
      type: object
      required:
        - id
        - name
        - cpu_percent
        - mem_usage
        - mem_percent
        - net_io
        - block_io
        - pids
      properties:
        id:
          type: string
          description: The short container id.
        name:
          type: string
          description: The container name.
        cpu_percent:
          type: string
          description: CPU use as Docker prints it, such as `0.00%`.
        mem_usage:
          type: string
          description: Memory used and the limit, such as `10.96MiB / 7.755GiB`.
        mem_percent:
          type: string
          description: Memory use as a percentage string.
        net_io:
          type: string
          description: Network bytes in and out.
        block_io:
          type: string
          description: Disk bytes read and written.
        pids:
          type: string
          description: The number of processes.
    ContainerStatsList:
      type: object
      required:
        - available
        - stats
      properties:
        available:
          type: boolean
          description: '`false` when Docker did not answer.'
        message:
          type: string
          description: Why Docker is unavailable. Present only when `available` is `false`.
        stats:
          type: array
          items:
            $ref: '#/components/schemas/ContainerStats'
          description: One reading per running container. Empty when Docker is unavailable.
    DockerActionResult:
      type: object
      required:
        - action
        - container
        - status
      properties:
        action:
          type: string
          enum:
            - restart
            - stop
          description: What was done.
        container:
          type: string
          description: The container name.
        status:
          type: string
          enum:
            - ok
          description: '`ok`.'
    ConfirmRequest:
      type: object
      required:
        - confirm
      properties:
        confirm:
          type: boolean
          enum:
            - true
          description: Must be the boolean `true`.
    AlertItem:
      type: object
      required:
        - status
        - current
        - threshold
      properties:
        status:
          type: string
          enum:
            - ok
            - warning
            - critical
          description: How the reading compares with the threshold.
        current:
          type: number
          description: The reading in percent.
        threshold:
          type: number
          description: The threshold from your config in percent.
    DiskAlert:
      allOf:
        - $ref: '#/components/schemas/AlertItem'
        - type: object
          required:
            - mount
          properties:
            mount:
              type: string
              description: The mount point checked.
    AlertResult:
      type: object
      required:
        - cpu
        - memory
        - disks
      properties:
        cpu:
          $ref: '#/components/schemas/AlertItem'
        memory:
          $ref: '#/components/schemas/AlertItem'
        disks:
          type: array
          items:
            $ref: '#/components/schemas/DiskAlert'
          description: One entry per mounted disk.
    WatchTarget:
      type: object
      required:
        - container
        - added_at
      properties:
        container:
          type: string
          description: The name of the container, unit or app.
        kind:
          type: string
          description: '`docker`, `systemd` or `pm2`.'
        unit:
          type: string
          description: The container, service or app name. It defaults to `container`.
        added_at:
          type: string
          format: date-time
          description: When the target was added.
    WatchOverview:
      type: object
      required:
        - targets
        - service
        - retention
      properties:
        targets:
          type: array
          items:
            $ref: '#/components/schemas/WatchTarget'
          description: The watch list.
        service:
          type: object
          required:
            - installed
          description: The service that polls the watch list.
          properties:
            installed:
              type: boolean
              description: '`true` when a unit file exists. It does not say the supervisor is running it.'
            unit:
              type: string
              description: The path of the unit file.
        retention:
          type: object
          required:
            - kept
            - max
          description: How full the incident directory is.
          properties:
            kept:
              type: integer
              description: Incidents on disk.
            max:
              type: integer
              description: The most incidents kept. `0` means unlimited.
    CrashSummary:
      type: object
      required:
        - category
        - confidence
        - exit_code
        - reason
      properties:
        category:
          type: string
          enum:
            - oom
            - segfault
            - sigterm
            - panic
            - dependency
            - fatal_error
            - timeout
            - error
            - clean_restart
            - unknown
          description: The kind of crash the logs point to.
        confidence:
          type: string
          enum:
            - high
            - medium
            - low
          description: How sure the analysis is.
        exit_code:
          type: integer
          description: The exit code of the previous run.
        reason:
          type: string
          description: A sentence that explains the category.
        signal:
          type: string
          description: The signal that ended the process, when there was one.
        patterns:
          type: array
          items:
            type: string
          description: The log patterns that matched.
    Flapping:
      type: object
      required:
        - count
        - is_flapping
        - level
        - since
        - window
      properties:
        count:
          type: integer
          description: Restarts inside the window.
        is_flapping:
          type: boolean
          description: '`true` when the restart count crossed the flapping threshold.'
        level:
          type: string
          description: How severe the flapping is.
        since:
          type: string
          format: date-time
          description: The start of the window.
        window:
          type: string
          description: The length of the window.
    Incident:
      type: object
      required:
        - id
        - container
        - detected_at
        - restart_count
        - prev_started_at
        - curr_started_at
        - pre_logs
        - post_logs
      properties:
        id:
          type: string
          description: The incident id.
        container:
          type: string
          description: The watch target that restarted.
        detected_at:
          type: string
          format: date-time
          description: When the restart was detected.
        restart_count:
          type: integer
          description: Docker's restart count at detection.
        prev_started_at:
          type: string
          description: When the previous run started, RFC 3339 in UTC, or an empty string when unknown.
        curr_started_at:
          type: string
          description: When the current run started, RFC 3339 in UTC, or an empty string when unknown.
        pre_logs:
          type: string
          description: Logs captured before the restart. Empty in a list.
        post_logs:
          type: string
          description: Logs captured at detection. Empty in a list.
        exit_code:
          type:
            - integer
            - 'null'
          description: The exit code of the previous run.
        oom_killed:
          type: boolean
          description: '`true` when the kernel killed the process for memory.'
        recovered:
          type: boolean
          description: '`true` when the target is running again.'
        source:
          type: string
          description: Where the incident was detected.
        proxmox_class:
          type: string
          description: The failure class, for a Proxmox guest.
        proxmox_state:
          type: string
          description: The guest state, for a Proxmox guest.
        crash_analysis:
          $ref: '#/components/schemas/CrashSummary'
        flapping:
          $ref: '#/components/schemas/Flapping'
    WatchAddRequest:
      type: object
      required:
        - container
      properties:
        container:
          type: string
          description: The name of the container, systemd unit or pm2 app to watch.
          example: flaky
        kind:
          type: string
          enum:
            - docker
            - systemd
            - pm2
          default: docker
          description: What kind of target it is.
        unit:
          type: string
          description: The actual service or app name, when it differs from `container`.
    WatchAddResult:
      type: object
      required:
        - container
        - kind
        - added
      properties:
        container:
          type: string
          description: The target name.
        kind:
          type: string
          description: The kind from the request, or `docker`.
        added:
          type: boolean
          description: '`false` when the target was already on the list.'
    WatchRemoveResult:
      type: object
      required:
        - container
        - removed
      properties:
        container:
          type: string
          description: The target name.
        removed:
          type: boolean
          description: '`true`.'
    WatchRunResult:
      type: object
      required:
        - checked
      properties:
        checked:
          type: integer
          description: The number of targets inspected.
        incidents:
          type: array
          items:
            $ref: '#/components/schemas/Incident'
          description: The incidents this check recorded. Absent when there were none.
        skipped:
          type: array
          description: Targets a one-shot check cannot inspect.
          items:
            type: object
            required:
              - kind
              - name
            properties:
              kind:
                type: string
                description: The target kind.
              name:
                type: string
                description: The target name.
    BackupRequest:
      type: object
      properties:
        service:
          type: string
          description: Back up only this compose service. Without it, every running compose service is backed up.
          example: gitea
        exclude:
          type: array
          items:
            type: string
          description: Mount sources to leave out of the archive.
    PruneResult:
      type: object
      required:
        - kept
        - kept_bytes
      properties:
        removed:
          type: array
          items:
            type: string
          description: The archives retention deleted.
        freed_bytes:
          type: integer
          description: Bytes freed.
        kept:
          type: integer
          description: Archives kept.
        kept_bytes:
          type: integer
          description: Bytes kept.
    BackupResult:
      type: object
      required:
        - archive
        - services
        - volumes
        - size
      properties:
        archive:
          type: string
          description: The path of the archive.
        services:
          type: array
          items:
            type: string
          description: The compose services in the archive.
        volumes:
          type: integer
          description: The number of mounts written.
        size:
          type: string
          description: The archive size as text, such as `1.7 KB`.
        skipped:
          type: array
          items:
            type: string
          description: Mounts left out by `exclude`, as `service:source`.
        unmatched_excludes:
          type: array
          items:
            type: string
          description: Entries of `exclude` that matched no mount.
        pruned:
          $ref: '#/components/schemas/PruneResult'
    BackupListEntry:
      type: object
      required:
        - name
        - path
        - size
        - created_at
      properties:
        name:
          type: string
          description: The file name.
        path:
          type: string
          description: The full path. Use it as `archive`.
        size:
          type: string
          description: The size as text.
        created_at:
          type: string
          description: When the archive was written, RFC 3339.
    DrillRequest:
      type: object
      properties:
        app:
          type: string
          description: The app to drill, such as `gitea`. Without it, every app in the archive that has a health check is drilled.
          example: gitea
        archive:
          type: string
          description: The path of the archive. Without it, the newest archive in the backup directory.
    DrillResult:
      type: object
      required:
        - app
        - archive
        - size
        - file_count
        - integrity
        - booted
        - boot_seconds
        - health_port
        - health_status
        - passed
        - total_seconds
        - drilled_at
      properties:
        app:
          type: string
          description: The app drilled.
        archive:
          type: string
          description: The archive used.
        size:
          type: string
          description: The archive size as text.
        file_count:
          type: integer
          description: Files in the archive.
        integrity:
          type: boolean
          description: '`true` when the archive read back without errors.'
        booted:
          type: boolean
          description: '`true` when the container started.'
        boot_seconds:
          type: integer
          description: Seconds the boot took.
        health_port:
          type: string
          description: The host port the health check used.
        health_status:
          type: integer
          description: The HTTP status the health endpoint answered with.
        passed:
          type: boolean
          description: '`true` when every stage passed.'
        total_seconds:
          type: integer
          description: Seconds the whole drill took.
        drilled_at:
          type: string
          description: When the drill started, RFC 3339 in UTC.
        error:
          type: string
          description: Why the drill failed.
        logs:
          type: string
          description: The booted container's logs, when the drill failed.
    DrillReport:
      type: object
      required:
        - results
        - total
        - passed
        - failed
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/DrillResult'
          description: One result per app.
        total:
          type: integer
          description: Apps drilled.
        passed:
          type: integer
          description: Drills that passed.
        failed:
          type: integer
          description: Drills that failed.
    RestoreRequest:
      type: object
      required:
        - archive
        - confirm_name
      properties:
        archive:
          type: string
          description: The path of the archive, from [List backups](/reference/api/backups/list-backups).
        service:
          type: string
          description: Restore only this service.
        confirm_name:
          type: string
          description: The same value as `archive`.
    RestoreResult:
      type: object
      required:
        - archive
        - services
        - volumes
      properties:
        archive:
          type: string
          description: The archive restored.
        services:
          type: array
          items:
            type: string
          description: The services restored.
        volumes:
          type: integer
          description: The number of mounts written.
        refused:
          type: array
          description: Mounts the restore would not write.
          items:
            type: object
            required:
              - service
              - type
              - target
              - reason
            properties:
              service:
                type: string
                description: The service that declares the mount.
              type:
                type: string
                description: The mount type, such as `bind`.
              target:
                type: string
                description: The path on the machine.
              reason:
                type: string
                description: Why it was refused.
    InstallApp:
      type: object
      required:
        - name
        - description
        - default_port
        - container_port
        - data_path
      properties:
        name:
          type: string
          description: The app name.
        description:
          type: string
          description: What the app does.
        default_port:
          type: string
          description: The host port used when you send none.
        container_port:
          type: string
          description: The port inside the container.
        data_path:
          type: string
          description: The data path inside the container.
    InstallStatus:
      type: object
      required:
        - app
        - installed
      properties:
        app:
          type: string
          description: The app name.
        installed:
          type: boolean
          description: '`true` when homebutler installed the app.'
        state:
          type: string
          description: The containers' state, such as `running` or `stopped`. Present only when `installed` is `true`.
    InstallRequest:
      type: object
      properties:
        port:
          type: string
          description: The host port, as a string. It defaults to the app's `default_port`. A JSON number in its place is ignored, and the app installs on the default port.
          example: '18620'
    PurgeRequest:
      type: object
      required:
        - confirm_name
      properties:
        confirm_name:
          type: string
          description: The same value as the `app` in the path.
    InstallResult:
      type: object
      required:
        - status
        - app
      properties:
        status:
          type: string
          enum:
            - installed
            - failed
            - uninstalled
            - purged
          description: What happened.
        app:
          type: string
          description: The app name.
        issues:
          type: array
          items:
            type: string
          description: Why a pre-flight check failed. Present when `status` is `failed`.
        port:
          type: string
          description: The host port.
        path:
          type: string
          description: The folder with the app's compose file and data.
        state:
          type: string
          description: The containers' state after the install.
        data_preserved:
          type: boolean
          description: '`true` after an uninstall, `false` after a purge.'
        warning:
          type: string
          description: Present when an earlier install's state couldn't be carried over, or when part of the data is in Docker volumes outside the app directory.
        kept_volumes:
          type: array
          items:
            type: string
          description: Volumes that still exist after a purge. Present only when not empty.
        unchecked_volumes:
          type: array
          items:
            type: string
          description: Volumes Docker couldn't be asked about during a purge. Present only when not empty.
    ProxmoxEndpoint:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The endpoint name in your config.
    ProxmoxCluster:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          description: '`cluster` or `node`.'
        id:
          type: string
          description: The entry id.
        name:
          type: string
          description: The cluster or node name.
        ip:
          type: string
          description: The node address.
        level:
          type: string
          description: The support level.
        local:
          type: boolean
          description: '`true` for the node that answered.'
        nodeid:
          type: integer
          description: The node id in the cluster.
        nodes:
          type: integer
          description: The number of nodes.
        online:
          type: boolean
          description: '`true` when the node is online.'
        quorate:
          type:
            - boolean
            - 'null'
          description: '`true` when the cluster has quorum.'
        version:
          type: integer
          description: The cluster config version.
    ProxmoxGuest:
      type: object
      required:
        - vmid
        - node
        - type
        - status
        - template
      properties:
        vmid:
          type: integer
          description: The guest id.
        node:
          type: string
          description: The node the guest runs on.
        type:
          type: string
          enum:
            - qemu
            - lxc
          description: The guest type.
        status:
          type: string
          description: The guest status, such as `running` or `stopped`.
        template:
          type: boolean
          description: '`true` for a template.'
        name:
          type: string
          description: The guest name.
        cpu:
          type: number
          description: CPU use as a fraction of the allocation.
        max_cpu:
          type: number
          description: The CPUs allocated.
        mem:
          type: integer
          description: Memory used in bytes.
        max_mem:
          type: integer
          description: Memory allocated in bytes.
        disk:
          type: integer
          description: Disk used in bytes.
        max_disk:
          type: integer
          description: Disk allocated in bytes.
        net_in:
          type: integer
          description: Network bytes received.
        net_out:
          type: integer
          description: Network bytes sent.
        uptime:
          type: integer
          description: Seconds since the guest started.
        lock:
          type: string
          description: The lock held on the guest, such as `backup`.
        pool:
          type: string
          description: The resource pool.
        tags:
          type: array
          items:
            type: string
          description: The guest's tags.
    ProxmoxNode:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          description: The node name.
        status:
          type: string
          description: The node status, such as `online`.
        level:
          type: string
          description: The support level.
        local:
          type: boolean
          description: '`true` for the node that answered.'
        cpu:
          type: number
          description: CPU use as a fraction.
        max_cpu:
          type: number
          description: The CPUs available.
        mem:
          type: integer
          description: Memory used in bytes.
        max_mem:
          type: integer
          description: Memory available in bytes.
        uptime:
          type: integer
          description: Seconds since boot.
        ssl_fingerprint:
          type: string
          description: The node's TLS fingerprint.
    ProxmoxStorage:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The storage name.
        node:
          type: string
          description: The node it is on.
        type:
          type: string
          description: The storage type, such as `dir`.
        status:
          type: string
          description: The storage status.
        content:
          type: string
          description: What the storage holds.
        shared:
          type: boolean
          description: '`true` when every node sees it.'
        total:
          type: integer
          description: Size in bytes.
        used:
          type: integer
          description: Used bytes.
    ProxmoxStatus:
      type: object
      required:
        - version
        - cluster
        - resources
        - status
      properties:
        version:
          type: object
          required:
            - version
            - release
          description: The Proxmox VE version.
          properties:
            version:
              type: string
              description: The version number.
            release:
              type: string
              description: The release.
            repo_id:
              type: string
              description: The repository id.
        cluster:
          type: array
          items:
            $ref: '#/components/schemas/ProxmoxCluster'
          description: The cluster and its nodes.
        resources:
          type: object
          required:
            - nodes
            - guests
            - storage
          description: Everything Proxmox lists as a resource.
          properties:
            nodes:
              type: array
              items:
                $ref: '#/components/schemas/ProxmoxNode'
              description: The nodes.
            guests:
              type: array
              items:
                $ref: '#/components/schemas/ProxmoxGuest'
              description: The virtual machines and containers.
            storage:
              type: array
              items:
                $ref: '#/components/schemas/ProxmoxStorage'
              description: The storage.
        failed_collectors:
          type: array
          items:
            type: string
            enum:
              - version
              - cluster
              - resources
          description: The reads that failed in this reading.
        failure_classes:
          type: object
          additionalProperties:
            type: string
          description: The failure class of each failed read.
        warnings:
          type: array
          items:
            type: string
          description: Problems that did not stop the reading.
        status:
          type: string
          enum:
            - current
            - partially_readable
            - stale
            - unavailable
          description: '`current` is a full reading taken now. `partially_readable` means some reads failed. `stale` is the last good reading, shown because a new one failed. `unavailable` means no reading has worked.'
        updated_at:
          type: string
          format: date-time
          description: When the readings were taken. Absent when `status` is `unavailable`.
        failure_class:
          type: string
          enum:
            - configuration
            - response
            - tls
            - authentication
            - authorization
            - transport
          description: Why a read failed.
        message:
          type: string
          description: A sentence about the failure, when there is no class.
        refresh_failed_collectors:
          type: array
          items:
            type: string
          description: The reads that failed when a stale reading was refreshed.
        refresh_failure_classes:
          type: object
          additionalProperties:
            type: string
          description: The failure class of each read in `refresh_failed_collectors`.
    GuestActionRequest:
      type: object
      required:
        - node
        - type
      properties:
        node:
          type: string
          description: The `node` of the guest.
          example: pve
        type:
          type: string
          enum:
            - qemu
            - lxc
          description: The `type` of the guest.
    GuestShutdownRequest:
      allOf:
        - $ref: '#/components/schemas/GuestActionRequest'
        - type: object
          required:
            - confirm
          properties:
            confirm:
              type: boolean
              enum:
                - true
              description: Must be the boolean `true`.
    GuestActionResult:
      type: object
      required:
        - action
        - endpoint
        - node
        - status
        - type
        - upid
        - vmid
      properties:
        action:
          type: string
          enum:
            - start
            - shutdown
            - reboot
          description: What was asked.
        endpoint:
          type: string
          description: The endpoint name.
        node:
          type: string
          description: The node.
        type:
          type: string
          description: '`qemu` or `lxc`.'
        vmid:
          type: integer
          description: The guest id.
        status:
          type: string
          enum:
            - accepted
          description: '`accepted`: Proxmox queued the task.'
        upid:
          type: string
          description: The Proxmox task id.
    WakeTarget:
      type: object
      required:
        - name
        - mac
      properties:
        name:
          type: string
          description: The target name.
        mac:
          type: string
          description: The MAC address.
    WakeResult:
      type: object
      required:
        - action
        - mac
        - broadcast
        - status
      properties:
        action:
          type: string
          description: '`wake`.'
        mac:
          type: string
          description: The MAC address.
        broadcast:
          type: string
          description: The address the packet went to.
        status:
          type: string
          enum:
            - sent
          description: '`sent`.'
    NotifyTestResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          description: One result per configured channel.
          items:
            type: object
            required:
              - channel
              - sent
            properties:
              channel:
                type: string
                description: The channel name.
              sent:
                type: boolean
                description: '`true` when the channel accepted the message.'
              error:
                type: string
                description: Why sending failed.
    ConfigServer:
      type: object
      required:
        - name
        - host
        - local
        - user
        - port
        - auth
        - key
        - password_set
      properties:
        name:
          type: string
          description: The server name.
        host:
          type: string
          description: The address.
        local:
          type: boolean
          description: '`true` for the machine homebutler runs on.'
        user:
          type: string
          description: The SSH user.
        port:
          type: integer
          description: The SSH port. `0` means the default.
        auth:
          type: string
          enum:
            - key
            - password
          description: How homebutler signs in.
        key:
          type: string
          description: The file name of the key, without its folder.
        password_set:
          type: boolean
          description: '`true` when a password is saved. The password is never returned.'
    ConfigProxmox:
      type: object
      required:
        - name
        - host
        - port
        - token_id
        - token_set
        - token_in_file
        - action_token_id
        - action_token_set
        - action_token_in_file
      properties:
        name:
          type: string
          description: The endpoint name.
        host:
          type: string
          description: The address.
        port:
          type: integer
          description: The API port. `0` means the default.
        token_id:
          type: string
          description: The read-only token id. It names a user and is not a secret.
        token_set:
          type: boolean
          description: '`true` when the read-only token is saved.'
        token_in_file:
          type: boolean
          description: '`true` when the token is kept in a file. The address of such an endpoint cannot be changed here.'
        action_token_id:
          type: string
          description: The action token id.
        action_token_set:
          type: boolean
          description: '`true` when the action token is saved.'
        action_token_in_file:
          type: boolean
          description: '`true` when the action token is kept in a file.'
    ConfigWake:
      type: object
      required:
        - name
        - mac
        - broadcast
      properties:
        name:
          type: string
          description: The target name.
        mac:
          type: string
          description: The MAC address.
        broadcast:
          type: string
          description: The broadcast address. Empty means `255.255.255.255`.
    ChannelField:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The key name.
        secret:
          type: boolean
          description: '`true` for a credential.'
        optional:
          type: boolean
          description: '`true` when the channel works without it.'
        value:
          type: string
          description: The value. Present only for a field that is not a secret.
        set:
          type: boolean
          description: '`true` when a secret has a value. Present only for a secret.'
    ChannelSettings:
      type: object
      required:
        - channel
        - configured
        - fields
      properties:
        channel:
          type: string
          description: 'The channel name: `telegram`, `slack`, `discord`, `webhook`, `ntfy` or `gotify`.'
        configured:
          type: boolean
          description: '`true` when the channel has every key it needs.'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ChannelField'
          description: The channel's keys, in the order a form asks for them.
    ConfigResponse:
      type: object
      required:
        - path
        - servers
        - proxmox
        - alerts
        - wake
        - notify
        - editable
        - transport_warning
      properties:
        path:
          type: string
          description: The config file in use, or `(defaults)` when there is none.
        servers:
          type: array
          items:
            $ref: '#/components/schemas/ConfigServer'
          description: The servers.
        proxmox:
          type: array
          items:
            $ref: '#/components/schemas/ConfigProxmox'
          description: The Proxmox endpoints.
        alerts:
          type: object
          required:
            - cpu
            - memory
            - disk
          description: The alert thresholds in percent.
          properties:
            cpu:
              type: number
              description: The CPU threshold.
            memory:
              type: number
              description: The memory threshold.
            disk:
              type: number
              description: The disk threshold.
        wake:
          type: array
          items:
            $ref: '#/components/schemas/ConfigWake'
          description: The wake targets.
        notify:
          type: array
          items:
            $ref: '#/components/schemas/ChannelSettings'
          description: Every channel homebutler has, configured or not.
        editable:
          type: boolean
          description: '`true` when the server has a token, which is what enables the save routes.'
        transport_warning:
          type: string
          description: A warning when the token travels over plain HTTP on a public address. Empty otherwise.
        revision:
          type: string
          description: Send this back with a save. Present only when `editable` is `true` and the config file exists. It is valid until the file changes or the server restarts.
    SecretInput:
      type: object
      properties:
        value:
          type: string
          description: The new secret.
        clear:
          type: boolean
          description: '`true` removes the secret.'
    AlertsRequest:
      type: object
      required:
        - revision
      properties:
        revision:
          type: string
          description: The `revision` from [Get config](/reference/api/config/get-config).
        cpu:
          type: number
          description: The new CPU threshold in percent.
        memory:
          type: number
          description: The new memory threshold in percent.
        disk:
          type: number
          description: The new disk threshold in percent.
    NotifyChannelInput:
      type: object
      properties:
        values:
          type: object
          additionalProperties:
            type: string
          description: Values for keys that are not secrets.
        secrets:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SecretInput'
          description: Secrets to set or clear, by key.
        remove:
          type: boolean
          description: '`true` removes the channel.'
    NotifyRequest:
      type: object
      required:
        - revision
        - channels
      properties:
        revision:
          type: string
          description: The `revision` from [Get config](/reference/api/config/get-config).
        channels:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/NotifyChannelInput'
          description: The channels to change, by name.
    WakeTargetInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The target name.
        mac:
          type: string
          description: The MAC address. Send it with every add or change, including a change that only edits `broadcast`.
        broadcast:
          type: string
          description: The broadcast address.
        remove:
          type: boolean
          description: '`true` removes the target.'
    WakeRequest:
      type: object
      required:
        - revision
        - targets
      properties:
        revision:
          type: string
          description: The `revision` from [Get config](/reference/api/config/get-config).
        targets:
          type: array
          items:
            $ref: '#/components/schemas/WakeTargetInput'
          description: The targets to add, change or remove.
    ServerInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The server to add or change.
        rename:
          type: string
          description: A new name for the server.
        host:
          type: string
          description: The address.
        port:
          type: integer
          description: The SSH port.
        user:
          type: string
          description: The SSH user.
        auth:
          type: string
          enum:
            - key
            - password
          description: How homebutler signs in.
        password:
          $ref: '#/components/schemas/SecretInput'
        remove:
          type: boolean
          description: '`true` removes the server.'
    ServersRequest:
      type: object
      required:
        - revision
        - servers
      properties:
        revision:
          type: string
          description: The `revision` from [Get config](/reference/api/config/get-config).
        servers:
          type: array
          items:
            $ref: '#/components/schemas/ServerInput'
          description: The servers to add, change or remove.
    ProxmoxEndpointInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The endpoint to add or change.
        rename:
          type: string
          description: A new name for the endpoint.
        host:
          type: string
          description: The address.
        port:
          type: integer
          description: The API port.
        token_id:
          type: string
          description: The read-only token id.
        token:
          $ref: '#/components/schemas/SecretInput'
        action_token_id:
          type: string
          description: The action token id.
        action_token:
          $ref: '#/components/schemas/SecretInput'
        remove:
          type: boolean
          description: '`true` removes the endpoint.'
    ProxmoxRequest:
      type: object
      required:
        - revision
        - endpoints
      properties:
        revision:
          type: string
          description: The `revision` from [Get config](/reference/api/config/get-config).
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/ProxmoxEndpointInput'
          description: The endpoints to add, change or remove.
    SaveResponse:
      type: object
      required:
        - saved
        - revision
      properties:
        saved:
          type: boolean
          description: '`true`.'
        revision:
          type: string
          description: The revision of the file as saved. Use it for the next save.
        restart_needed:
          type: array
          items:
            type: string
          description: The processes that read this setting at start and need a restart to use it.
        notices:
          type: array
          items:
            type: string
          description: Things that are true about the save and worth knowing.
    Capability:
      type: object
      required:
        - name
        - description
        - risk
        - targets
      properties:
        name:
          type: string
          description: The capability name, the same as the MCP tool name.
        description:
          type: string
          description: What it does.
        risk:
          type: string
          enum:
            - read
            - write
            - destructive
          description: What a call can cost.
        targets:
          type: array
          items:
            type: string
            enum:
              - local
              - server
              - proxmox
          description: What it can be pointed at.
        method:
          type: string
          description: The HTTP method of its route.
        path:
          type: string
          description: The path of its route.
        absent:
          type: string
          description: Why it has no route. Present only when `method` and `path` are absent.
    Version:
      type: object
      required:
        - version
      properties:
        version:
          type: string
          description: The homebutler version.
