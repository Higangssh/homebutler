version: 2

builds:
  - main: .
    binary: homebutler
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.buildDate={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# The image is built from the binary above rather than from source, so the
# dashboard assets embedded by `make build-web` are in it. A Dockerfile that
# ran `go build` itself would produce an image whose web dashboard is an empty
# directory, and nothing would notice until somebody opened it.
dockers_v2:
  - images:
      - "ghcr.io/higangssh/homebutler"
    tags:
      - "{{ .Version }}"
      - "latest"
    platforms:
      - "linux/amd64"
      - "linux/arm64"
    dockerfile: Dockerfile
    labels:
      org.opencontainers.image.source: "https://github.com/Higangssh/homebutler"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.licenses: "MIT"
      org.opencontainers.image.description: "Tells you what changed on your server, and only what is worth telling"

changelog:
  sort: asc
  use: github
  groups:
    - title: "🚀 Features"
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: "🔒 Security"
      regexp: '^.*?security(\(.+\))??!?:.+$'
      order: 2
    - title: "📦 Others"
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "^style:"
      - "^ci:"
